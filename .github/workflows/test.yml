name: Tests

on:
  push:
    paths:
      - 'new-torrents.py'
      - 'tests/test_new_torrents.py'
      - 'tests/fixtures/**'
      - 'status_update.py'
      - 'tests/test_status_update.py'
      - 'status-update.sh'
      - 'tests/test_status_update_sh.py'
      - 'transmission-upgrade.sh'
      - 'tests/test_transmission_upgrade.py'
      - 'debian-torrents-fetch.sh'
      - 'tests/test_debian_torrents_fetch.py'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'new-torrents.py'
      - 'tests/test_new_torrents.py'
      - 'tests/fixtures/**'
      - 'status_update.py'
      - 'tests/test_status_update.py'
      - 'status-update.sh'
      - 'tests/test_status_update_sh.py'
      - 'transmission-upgrade.sh'
      - 'tests/test_transmission_upgrade.py'
      - 'debian-torrents-fetch.sh'
      - 'tests/test_debian_torrents_fetch.py'
      - '.github/workflows/test.yml'
jobs:
  maintenance-shell-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash -n transmission-upgrade.sh
      - run: bash -n debian-torrents-fetch.sh
      - run: python3 tests/test_transmission_upgrade.py -v
      - run: python3 tests/test_debian_torrents_fetch.py -v
  maintenance-shell-almalinux:
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y python3
      - run: bash -n transmission-upgrade.sh
      - run: bash -n debian-torrents-fetch.sh
      - run: python3 tests/test_transmission_upgrade.py -v
      - run: python3 tests/test_debian_torrents_fetch.py -v
  status-update-shell-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash -n status-update.sh
      - run: python3 tests/test_status_update_sh.py -v
  status-update-shell-almalinux:
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y python3
      - run: bash -n status-update.sh
      - run: python3 tests/test_status_update_sh.py -v
  new-torrents-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tests/test_new_torrents.py -v
  new-torrents-almalinux:
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y python3
      - run: python3 tests/test_new_torrents.py -v
  status-update-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tests/test_status_update.py -v
  status-update-almalinux:
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y python3
      - run: python3 tests/test_status_update.py -v
