name: Tests

on:
  push:
    paths:
      - 'new-torrents.py'
      - 'tests/test_new_torrents.py'
      - 'tests/fixtures/**'
      - 'mirror-index.sh'
      - 'tests/test_mirror_index.py'
      - 'ipv6-stats.py'
      - 'tests/test_ipv6_stats.py'
      - 'transmission-upgrade.sh'
      - 'tests/test_transmission_upgrade.py'
      - 'new-speedtest.sh'
      - 'tests/test_new_speedtest.py'
      - 'debian-torrents-fetch.sh'
      - 'tests/test_debian_torrents_fetch.py'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'new-torrents.py'
      - 'tests/test_new_torrents.py'
      - 'tests/fixtures/**'
      - 'mirror-index.sh'
      - 'tests/test_mirror_index.py'
      - 'ipv6-stats.py'
      - 'tests/test_ipv6_stats.py'
      - 'transmission-upgrade.sh'
      - 'tests/test_transmission_upgrade.py'
      - 'new-speedtest.sh'
      - 'tests/test_new_speedtest.py'
      - 'debian-torrents-fetch.sh'
      - 'tests/test_debian_torrents_fetch.py'
      - '.github/workflows/test.yml'
jobs:
  maintenance-shell-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash -n transmission-upgrade.sh
      - run: bash -n new-speedtest.sh
      - run: bash -n debian-torrents-fetch.sh
      - run: python3 tests/test_transmission_upgrade.py -v
      - run: python3 tests/test_new_speedtest.py -v
      - run: python3 tests/test_debian_torrents_fetch.py -v
  maintenance-shell-almalinux:
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y python3
      - run: bash -n transmission-upgrade.sh
      - run: bash -n new-speedtest.sh
      - run: bash -n debian-torrents-fetch.sh
      - run: python3 tests/test_transmission_upgrade.py -v
      - run: python3 tests/test_new_speedtest.py -v
      - run: python3 tests/test_debian_torrents_fetch.py -v
  mirror-index-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash -n mirror-index.sh
      - run: python3 tests/test_mirror_index.py -v
  mirror-index-almalinux:
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y python3
      - run: bash -n mirror-index.sh
      - run: python3 tests/test_mirror_index.py -v
  ipv6-stats-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tests/test_ipv6_stats.py -v
  ipv6-stats-almalinux:
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y python3
      - run: python3 tests/test_ipv6_stats.py -v
  new-torrents-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tests/test_new_torrents.py -v
  new-torrents-almalinux:
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - uses: actions/checkout@v4
      - run: dnf install -y python3
      - run: python3 tests/test_new_torrents.py -v
